name: release

on:
  schedule:
    - cron: '0 7 1 * *'   # 07:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      api:
        description: 'Enrich database from anaconda.org (--api)'
        type: boolean
        default: false
      force:
        description: 'Bump db version even if content unchanged (--force)'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build and publish to CPAN

    permissions:
      contents: write   # push updated files + create release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      # -----------------------------------------------------------------------
      # Clone bioconda-recipes
      # -----------------------------------------------------------------------
      - name: Clone bioconda-recipes
        run: |
          git clone --depth 1 https://github.com/bioconda/bioconda-recipes bioconda-recipes
          echo "RECIPES_SHA=$(git -C bioconda-recipes rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Rebuild the database
      # -----------------------------------------------------------------------
      - name: Rebuild database
        run: |
          ARGS="--repo bioconda-recipes --no-pull"
          [ "${{ inputs.api }}"   = "true" ] && ARGS="$ARGS --api"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          perl -Ilib maintainer/update-db.pl $ARGS

      # Set DB_VERSION and DB_CHANGED outputs for all subsequent steps.
      - name: Check if database changed
        id: db
        run: |
          DB_VERSION=$(perl -Ilib -MBioconda::Packages -e 'print Bioconda::Packages->new->db_version')
          echo "version=$DB_VERSION" >> "$GITHUB_OUTPUT"

          if git diff --quiet share/bioconda-packages.json.gz; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Database unchanged at $DB_VERSION — skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Database changed → new version $DB_VERSION"
          fi

      # -----------------------------------------------------------------------
      # Build and test (always — catches regressions even on a no-op rebuild)
      # -----------------------------------------------------------------------
      - name: Build
        run: |
          perl Makefile.PL
          make

      - name: Test
        run: make test

      # -----------------------------------------------------------------------
      # Everything below only runs when the database actually changed
      # -----------------------------------------------------------------------

      # Bump $VERSION in Packages.pm to the DB CalVer and prepend a Changes entry.
      # Both checks (before + after) make the step fail loudly if the substitution
      # doesn't land exactly where expected.
      - name: Bump module version
        if: steps.db.outputs.changed == 'true'
        run: |
          DB_VER="${{ steps.db.outputs.version }}"
          TODAY=$(date -u +%Y-%m-%d)

          # Sanity-check: the VERSION line must exist before we touch anything.
          grep -qP "^our \\\$VERSION = '[^']+';$" lib/Bioconda/Packages.pm \
            || { echo "ERROR: could not find VERSION line in Packages.pm"; exit 1; }

          # Rewrite the version in-place.
          perl -i -pe "s/^our \\\$VERSION = '[^']+';/our \\\$VERSION = '$DB_VER';/" \
            lib/Bioconda/Packages.pm

          # Verify the new value is exactly what we expect.
          grep -qP "^our \\\$VERSION = '$DB_VER';$" lib/Bioconda/Packages.pm \
            || { echo "ERROR: version bump failed — check Packages.pm"; exit 1; }

          echo "VERSION bumped to $DB_VER"

          # Prepend a new entry to Changes (insert before the first existing entry,
          # i.e. before line 3, right after the blank line that follows the header).
          perl -i -pe "
            print \"$DB_VER  $TODAY\n      - Database update: rebuilt from bioconda-recipes \$ENV{RECIPES_SHA}.\n\n\"
              if \$. == 3;
          " Changes

          echo "Changes updated"

      - name: make dist
        if: steps.db.outputs.changed == 'true'
        run: |
          # Regenerate Makefile so it picks up the bumped VERSION.
          perl Makefile.PL
          make dist
          TARBALL=$(ls Bioconda-Packages-*.tar.gz | sort -V | tail -1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Commit release files
        if: steps.db.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add share/bioconda-packages.json.gz \
                  lib/Bioconda/Packages.pm \
                  Changes
          git commit -m "release: ${{ steps.db.outputs.version }} (recipes ${{ env.RECIPES_SHA }})"
          git push

      - name: Create GitHub release
        if: steps.db.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="db-${{ steps.db.outputs.version }}"
          gh release create "$TAG" "${{ env.TARBALL }}" \
            --title "Bioconda::Packages ${{ steps.db.outputs.version }}" \
            --notes "DB version \`${{ steps.db.outputs.version }}\` built from bioconda-recipes \`${{ env.RECIPES_SHA }}\`." \
            --latest

      - name: Install CPAN::Uploader
        if: steps.db.outputs.changed == 'true'
        run: cpanm --quiet --notest CPAN::Uploader

      - name: Upload to CPAN
        if: steps.db.outputs.changed == 'true'
        env:
          PAUSE_USERNAME: ${{ secrets.PAUSE_USERNAME }}
          PAUSE_PASSWORD: ${{ secrets.PAUSE_PASSWORD }}
        run: cpan-upload -u "$PAUSE_USERNAME" -p "$PAUSE_PASSWORD" "${{ env.TARBALL }}"
