name: test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.40', '5.36']

    name: perl ${{ matrix.perl }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-perl-action@v1
        with:
          perl-version: ${{ matrix.perl }}

      - run: perl Makefile.PL
      - run: make
      - run: make test
